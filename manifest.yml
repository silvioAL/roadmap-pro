modules:
  jira:projectPage:
    - key: roadmap-forecaster-page
      title: Roadmap Forecaster Pro
      resource: main
      resolver:
        function: resolver

  function:
    - key: resolver
      handler: index.handler

resources:
  - key: main
    path: static/roadmap-app/build

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - write:jira-work
    - storage:app

app:
  id: ari:cloud:ecosystem::app/f07973b4-7d19-4aed-8a09-8f1b6d18924a
  runtime:
    name: nodejs22.x
